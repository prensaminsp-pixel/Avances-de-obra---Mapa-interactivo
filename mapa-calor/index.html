  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;

    // events at the element — warn only; real JS errors carry message/error.

        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded

    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.

      : '*';

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&

            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }

        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {

              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

          return;
        }

          // Strict artifact hosts allow font-src data: but not blob:.

            (entry.compressed ? toBase64(finalBytes) : entry.data);

          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

nforma avance de obra <i><\u002Fi><\u002Fbutton>\n        <label id=\"f-obra-wrap\" style=\"display:none\">Obra<select id=\"f-obra\" disabled=\"\"><\u002Fselect><\u002Flabel>\n        <label id=\"f-obranom-wrap\" style=\"display:none\">Nombre de la obra<input type=\"text\" id=\"f-obranom\" placeholder=\"Escribir nombre de obra\"><\u002Flabel>\n        <label id=\"f-av-wrap\" style=\"display:none\">% avance<input type=\"number\" id=\"f-av\" min=\"0\" max=\"100\" step=\"1\" placeholder=\"0-100\" style=\"max-width:92px\"><\u002Flabel>\n        <button class=\"add\" id=\"f-add\">Agregar<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"cf-recent\" id=\"f-recent\"><\u002Fdiv>\n      <div class=\"sync\" id=\"sync\"><button id=\"sync-btn\">↻ Actualizar desde la planilla<\u002Fbutton><span id=\"sync-st\">—<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <aside class=\"detail\" id=\"detail\"><\u002Faside>\n<\u002Fmain>\n\n<script src=\"549d8c20-c3e0-473e-84b6-98d97aebdbe0\"><\u002Fscript>\n<script>\n/* ── DATOS DE MUESTRA ─────────────────────────────────────────────── */\nconst CANALES = [\n  {id:'instagram', nom:'Instagram', color:'oklch(0.70 0.17 350)'},\n  {id:'tiktok',    nom:'TikTok',    color:'oklch(0.78 0.15 195)'},\n  {id:'linkedin',  nom:'LinkedIn',  color:'oklch(0.66 0.14 250)'},\n  {id:'x',         nom:'X',         color:'oklch(0.80 0.01 260)'}\n];\nconst TEMAS = [\n  {id:'vialidad',   nom:'Vialidad',                          color:'oklch(0.74 0.15 62)'},\n  {id:'planif',     nom:'Planificación y Transición Energética', color:'oklch(0.72 0.15 150)'},\n  {id:'saneam',     nom:'Saneamiento',                       color:'oklch(0.68 0.15 245)'},\n  {id:'biocomb',    nom:'Biocombustibles',                   color:'oklch(0.76 0.15 120)'},\n  {id:'hidrica',    nom:'Infraestructura Hídrica',           color:'oklch(0.70 0.14 215)'},\n  {id:'electrica',  nom:'Infraestructura Eléctrica',         color:'oklch(0.78 0.14 95)'},\n  {id:'arq',        nom:'Arquitectura',                      color:'oklch(0.68 0.16 330)'},\n  {id:'efem',       nom:'Efeméride / Institucional',         color:'oklch(0.66 0.15 285)'}\n];\nconst PARTIDOS = [\n  {id:'hpc',  nom:'Hacemos Unidos por Córdoba', color:'oklch(0.72 0.15 245)'},\n  {id:'ucr',  nom:'UCR / Juntos',               color:'oklch(0.78 0.14 95)'},\n  {id:'pro',  nom:'PRO',                        color:'oklch(0.70 0.16 285)'},\n  {id:'vec',  nom:'Vecinalismo',                color:'oklch(0.74 0.14 150)'}\n];\nconst HOY = (()=>{ const d = new Date(); d.setHours(12,0,0,0); return d; })();\n\n// Sin datos de obras cargados todavía (los de muestra fueron eliminados).\nconst OBRAS_RAW = [];\n\n// autoridad: [departamento, localidad, cargo, nombre, partido] — pendiente de carga\nconst AUTORIDADES_RAW = [];\n<\u002Fscript>\n<script>\n/* ── MODELO ───────────────────────────────────────────────────────── */\nconst norm = s => (s||'').normalize('NFD').replace(/[\\u0300-\\u036f]/g,'').replace(/¥/g,'N').replace(/Ñ|ñ/g,'N').toUpperCase().replace(/\\s+/g,' ').trim();\nconst CANAL = new Map(CANALES.map(c=>[c.id,c]));\nconst TEMA  = new Map(TEMAS.map(t=>[t.id,t]));\nconst PART  = new Map(PARTIDOS.map(p=>[p.id,p]));\n\nconst OBRAS = OBRAS_RAW.map((o,i)=>({\n  id:i, dep:o[0], key:norm(o[0]), nombre:o[1], localidad:o[2], tema:o[3], avance:o[4],\n  pubs:(o[5]||[]).map(p=>({canal:p[0], fecha:new Date(p[1]+'T12:00:00'), fechaISO:p[1]}))\n}));\nconst AUT = AUTORIDADES_RAW.map(a=>({dep:a[0], key:norm(a[0]), localidad:a[1], cargo:a[2], nombre:a[3], partido:a[4]}));\n\nconst LOCALIDADES = {\n 'CAPITAL':['Córdoba'],\n 'CALAMUCHITA':['Amboy','Embalse','La Cruz','Los Cóndores','Los Reartes','Río de los Sauces','San Agustín','Santa Rosa de Calamuchita','Villa Ciudad Parque','Villa del Dique','Villa General Belgrano','Villa Rumipal','Yacanto de Calamuchita'],\n 'COLON':['Agua de Oro','Colonia Caroya','El Manzano','Estación Juárez Celman','Jesús María','La Calera','Malvinas Argentinas','Mendiol tonio de Litín','Wenceslao Escalante']\n};\n\nconst SHEET = {\n  post:'https://script.google.com/macros/s/AKfycbwhmibPAa6wPZLZHgpPxu4IoQAq8b7NRSjmC8M61P8T9rBN0xOU_Di2ZQpClUS5j5o4/exec',\n  csv:'https://docs.google.com/spreadsheets/d/e/2PACX-1vT5bmLwM1gREUo_p0hBpTa3v_Md1feTwbAjegufKc9ZlpGSblPFMbe5IdsWdmq4skI9s3ir3-Ud-ZDS/pub?gid=364460407&single=true&output=csv'\n};\nconst LS_KEY = 'mapa-cordoba-pubs-pendientes-v2';\nlet MANUAL = [];\nlet PEND = [];\nlet REMOTAS = [];\ntry{ PEND = JSON.parse(localStorage.getItem(LS_KEY) || '[]'); }catch(e){ PEND = []; }\ntry{\n  const viejo = JSON.parse(localStorage.getItem('mapa-cordoba-pubs-manuales-v1') || '[]');\n  if(viejo.length){ PEND = PEND.concat(viejo); localStorage.removeItem('mapa-cordoba-pubs-manuales-v1'); }\n}catch(e){}\nPEND.forEach(m=>{ m.fecha = new Date(m.fechaISO+'T12:00:00'); m.pend = true; });\nMANUAL = PEND.slice();\nfunction guardarManual(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(PEND.map(m=>({key:m.key,dep:m.dep,localidad:m.localidad,canal:m.canal,tema:m.tema,fechaISO:m.fechaISO,obra:m.obra||null,avance:m.avance??null,id:m.id})))); }catch(e){} }\nconst claveP = m => [m.fechaISO,m.canal,m.tema,m.key,m.localidad,m.obra||'',(m.avance??'')].join('|');\nfunction replayManual(){\n  MANUAL.slice().sort((a,b)=>a.fecha-b.fecha).forEach(m=>{\n    if(!m.obra) return;\n    let o = OBRAS.find(x=>x.key===m.key && x.nombre===m.obra);\n    if(!o){\n      o = {id:OBRAS.length, dep:m.dep, key:m.key, nombre:m.obra, localidad:m.localidad, tema:m.tema, avance: m.avance!=null? m.avance : 0, pubs:[], nueva:true};\n      OBRAS.push(o);\n    }\n    if(m.avance!=null) o.avance = m.avance;\n    if(!o.pubs.some(p=>p.fechaISO===m.fechaISO && p.canal===m.canal)) o.pubs.push({canal:m.canal, fecha:m.fecha, fechaISO:m.fechaISO});\n  });\n}\nreplayManual();\nfunction guardarManual(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(MANUAL.map(m=>({key:m.key,dep:m.dep,localidad:m.localidad,canal:m.canal,tema:m.tema,fechaISO:m.fechaISO,obra:m.obra||null,avance:m.avance??null,id:m.id})))); }catch(e){} }\n\nconst METRICAS = [\n  {id:'pubs',   nom:'Publicaciones',     unidad:'publicaciones'},\n  {id:'dias',   nom:'Días sin publicar', unidad:'días desde la última publicación', alerta:true}\n];\nconst PERIODOS = [\n  {id:'all', nom:'Todo', dias:null},\n  {id:'90',  nom:'3 meses', dias:90},\n  {id:'30',  nom:'1 mes', dias:30},\n  {id:'7',   nom:'7 días', dias:7}\n];\nconst ACENTOS = {rio:'Río',ischilin:'Ischilín',juarez:'Juárez',union:'Unión',colon:'Colón',maria:'María',martin:'Martín',saenz:'Sáenz',dean:'Deán',cosquin:'Cosquín',chanar:'Chañar',pena:'Peña',cordoba:'Córdoba',jesus:'Jesús',calamuchita:'Calamuchita',anisacate:'Anisacate',belgrano:'Belgrano',tercero:'Tercero',totoral:'Totoral',sobremonte:'Sobremonte'};\nconst MINUS = new Set(['de','del','la','las','los','y','el']);\nfunction lindo(s){\n  if(!s) return '';\n  const limpio = String(s).replace(/¥/g,'Ñ').toLowerCase().trim();\n  return limpio.split(/\\s+/).map((w,i)=>{\n    const plano = w.normalize('NFD').replace(/[\\u0300-\\u036f]/g,'');\n    if(i>0 && MINUS.has(plano)) return plano;\n    if(ACENTOS[plano]) return ACENTOS[plano];\n    return w.replace(/^([a-záéíóúñ])/, (m,c)=>c.toUpperCase());\n  }).join(' ');\n}\n\nconst RAMPA = ['#eef1f5','#fde8c6','#f9cb85','#f0a944','#d67f1a','#a45a06'];\nconst RAMPA_ALERTA = ['#eef1f5','#fbe0dc','#f6bdb3','#ec9182','#d75f4c','#a83a27'];\nconst SIN_REGISTRO = 400;\n\nconst S = {\n  metric:'pubs',\n  canal:new Set(CANALES.map(c=>c.id)),\n  tema:new Set(TEMAS.map(t=>t.id)),\n  periodo:'all',\n  sel:null,\n  layers:{labels:true, base:true, zero:false},\n  rankOpen:true\n};\n\nfunction desde(){\n  const p = PERIODOS.find(x=>x.id===S.periodo);\n  if(!p.dias) return null;\n  return new Date(HOY.getTime() - p.dias*864e5);\n}\nconst fmtFecha = d => d.toLocaleDateString('es-AR',{day:'2-digit',month:'short'}).replace('.','');\n\n/* Publicaciones históricas con fecha (datos-publicaciones.js) */\nconst BASE_PUBS = (window.DATADAS||[]).map((d,i)=>({\n  id:'b'+i, fechaISO:d[0], fecha:new Date(d[0]+'T12:00:00'), canal:d[1], tema:d[2],\n  dep:d[3], key:norm(d[3]), localidad:(d[4]||'').trim() || '—', obra:null, avance:null, base:true\n}));\n/* Relevamiento agregado sin fecha: [dep, canal, tema, cantidad] */\nconst BASE_AGG = (window.BASE_TOTALES||[]).map(t=>({key:norm(t[0]), dep:t[0], canal:t[1], tema:t[2], n:t[3]}));\nconst BASE_LABEL = window.BASE_LABEL || 'período base';\n\nfunction pubsDe(obra){\n  const d0 = desde();\n  return obra.pubs.filter(p => S.canal.has(p.canal) && (!d0 || p.fecha >= d0));\n}\nfunction obrasDe(key){\n  return OBRAS.filter(o => o.key===key && S.tema.has(o.tema));\n}\nfunction resumen(key){\n  const obras = obrasDe(key);\n  const d0 = desde();\n  let pubs=0, av=0, ultima=null, agg=0;\n  const porCanal = {}, porTema = {};\n  const suma = (canal, tema, n)=>{ pubs += n; porCanal[canal]=(porCanal[canal]||0)+n; porTema[tema]=(porTema[tema]||0)+n; };\n\n  obras.forEach(o=>{ av += o.avance; });\n\n  BASE_PUBS.concat(MANUAL).forEach(m=>{\n    if(m.key!==key || !S.canal.has(m.canal) || !S.tema.has(m.tema)) return;\n    if(!ultima || m.fecha>ultima) ultima = m.fecha;\n    if(d0 && m.fecha < d0) return;\n    suma(m.canal, m.tema, 1);\n  });\n  const lista = BASE_PUBS.concat(MANUAL).filter(m=>\n    m.key===key && S.canal.has(m.canal) && S.tema.has(m.tema) && (!d0 || m.fecha >= d0));\n\n  if(S.layers.base && !d0){\n    BASE_AGG.forEach(t=>{\n      if(t.key!==key || !S.canal.has(t.canal) || !S.tema.has(t.tema)) return;\n      agg += t.n; suma(t.canal, t.tema, t.n);\n    });\n  }\n  const dias = ultima ? Math.floor((HOY - ultima)/864e5) : null;\n  return {obras:obras.length, pubs, agg, gap:0, avance: obras.length? Math.round(av/obras.length):0,\n    porCanal, porTema, lista:obras, manuales:lista, ultima, dias};\n}\nfunction valorMetrica(r){\n  if(S.metric==='dias') return r.pubs || r.ultima ? (r.dias===null ? SIN_REGISTRO : r.dias) : 0;\n  return r[S.metric] ?? 0;\n}\nconst textoMetrica = r => S.metric==='dias'\n  ? (r.dias===null ? (r.pubs? 's/f' : '—') : r.dias+'d')\n  : valorMetrica(r);\n\n/* ── MAPA ─────────────────────────────────────────────────────────── */\nconst svg = d3.select('#map'), tip = document.getElementById('tip');\nconst gRoot = svg.append('g'), gDep = gRoot.append('g'), gLine = gRoot.append('g'), gMark = gRoot.append('g'), gLab = gRoot.append('g');\nlet feats = [], fc = null, path = d3.geoPath(), proj = d3.geoMercator(), size=[0,0];\n\nconst zoom = d3.zoom().scaleExtent([1,10]).on('zoom', e=>{\n  gRoot.attr('transform', e.transform);\n  gDep.attr('stroke-width', 1.1/e.transform.k);\n  gLab.selectAll('text').style('font-size', (10.5/Math.sqrt(e.transform.k))+'px');\n  updateLabels(e.transform.k);\n});\nsvg.call(zoom);\n\nfetch('https://cdn.jsdelivr.net/gh/mgaitan/departamentos_argentina@master/departamentos-cordoba.topojson')\n  .then(r=>r.json())\n  .then(topo=>{\n    const obj = topo.objects[Object.keys(topo.objects)[0]];\n    fc = topojson.feature(topo, obj);\n    feats = fc.features.map(f=>{\n      const p = f.properties||{};\n      f.key = norm(p.departamento);\n      f.nombre = lindo(p.departamento);\n      f.cabecera = lindo(p.cabecera);\n      return f;\n    });\n    document.getElementById('status').classList.add('off');\n    fillForm();\n    sincronizar();\n    document.getElementById('hdr-sub').textContent = feats.length+' departamentos · límites oficiales IGN/INDEC';\n    build(); resize(); render();\n  })\n  .catch(err=>{\n    document.getElementById('status').innerHTML = '<span>no se pudo cargar la geometría<\u002Fspan><b>Revisá la conexión: el mapa toma los límites oficiales de departamentos desde una fuente pública.<\u002Fb>';\n    console.error(err);\n  });\n\nfunction build(){\n  gDep.attr('stroke','oklch(1 0 0)').attr('stroke-width',1.1)\n    .selectAll('path').data(feats).join('path')\n      .attr('class','dep')\n      .on('mousemove', (e,f)=>showTip(e,f))\n      .on('mouseleave', ()=>tip.style.opacity=0)\n      .on('click', (e,f)=>{ S.sel = S.sel===f.key? null : f.key; render(); });\n  gLine.attr('fill','none').attr('stroke','oklch(0.62 0.02 255 / .5)').attr('stroke-width',0.7).attr('pointer-events','none')\n    .selectAll('path').data([1]).join('path');\n  gLab.attr('pointer-events','none').selectAll('text').data(feats).join('text').attr('class','dlabel').text(f=>f.nombre);\n}\n\nfunction resize(){\n  const w = svg.node().clientWidth, h = svg.node().clientHeight;\n  if(!w||!h||!fc) return;\n  size=[w,h];\n  proj = d3.geoMercator().fitExtent([[14,14],[w-14,h-14]], fc);\n  path = d3.geoPath(proj);\n  gDep.selectAll('path').attr('d', path);\n  gLine.selectAll('path').attr('d', path(topojsonMesh()));\n  gLab.selectAll('text').attr('x', f=>proj(d3.geoCentroid(f))[0]).attr('y', f=>proj(d3.geoCentroid(f))[1]);\n  feats.forEach(f=>{ f.area = Math.abs(path.area(f)); });\n  updateLabels(d3.zoomTransform(svg.node()).k);\n  posMarks();\n}\nlet meshCache=null;\nfunction topojsonMesh(){ return meshCache || (meshCache = {type:'FeatureCollection', features:feats}); }\nnew ResizeObserver(()=>resize()).observe(document.querySelector('.map-wrap'));\ndocument.querySelector('main').addEventListener('transitionend', e=>{ if(e.propertyName==='grid-template-columns') resize(); });\n\nfunction updateLabels(k){\n  k = k || 1;\n  const nodes = gLab.selectAll('text').nodes();\n  const order = nodes.map(n=>({n, a: (d3.select(n).datum().area)||0})).sort((x,y)=>y.a-x.a);\n  const placed = [];\n  order.forEach(({n,a})=>{\n    const el = d3.select(n);\n    if(a * k * k < 260){ el.style('visibility','hidden'); return; }\n    el.style('visibility','visible');\n    let b;\n    try{ b = n.getBBox(); }catch(e){ return; }\n    const pad = 1.5/k;\n    const r = {x1:b.x-pad, y1:b.y-pad, x2:b.x+b.width+pad, y2:b.y+b.height+pad};\n    const hit = placed.some(p => !(r.x2 < p.x1 || r.x1 > p.x2 || r.y2 < p.y1 || r.y1 > p.y2));\n    if(hit) el.style('visibility','hidden'); else placed.push(r);\n  });\n}\nfunction posMarks(){\n  gMark.selectAll('g.mk').attr('transform', d=>{ const g = d.f || d; const c = proj(d3.geoCentroid(g)); return 'translate('+c[0]+','+(c[1]+13)+')'; });\n}\n\nfunction showTip(e, f){\n  const r = resumen(f.key), m = METRICAS.find(x=>x.id===S.metric);\n  tip.innerHTML = '<h4>'+f.nombre+'<\u002Fh4><dl>'\n    + '<dt>Publicaciones<\u002Fdt><b>'+r.pubs+'<\u002Fb>'\n    + (r.agg? '<dt>del relevamiento base<\u002Fdt><b>'+r.agg+'<\u002Fb>' : '')\n    + '<dt>Última publicación<\u002Fdt><b>'+(r.ultima? fmtFecha(r.ultima) : 's/f')+'<\u002Fb>'\n    + '<dt>Días sin publicar<\u002Fdt><b>'+(r.dias===null? '—' : r.dias)+'<\u002Fb>'\n    + '<\u002Fdl>';\n  const wrap = document.querySelector('.map-wrap').getBoundingClientRect();\n  let x = e.clientX - wrap.left + 14, y = e.clientY - wrap.top + 14;\n  tip.style.opacity = 1;\n  if(x + tip.offsetWidth > wrap.width - 8) x = e.clientX - wrap.left - tip.offsetWidth - 14;\n  if(y + tip.offsetHeight > wrap.height - 8) y = e.clientY - wrap.top - tip.offsetHeight - 14;\n  tip.style.left = x+'px'; tip.style.top = y+'px';\n}\n\n/* ── RENDER ───────────────────────────────────────────────────────── */\nfunction render(){\n  const datos = feats.map(f=>({f, r:resumen(f.key)}));\n  const met = METRICAS.find(x=>x.id===S.metric);\n  const rampa = met.alerta ? RAMPA_ALERTA : RAMPA;\n  const vals = datos.map(d=>valorMetrica(d.r)).filter(v=>v!==SIN_REGISTRO && v>0);\n  const max = (S.metric==='dias' ? (d3.max(vals)||60) : d3.max(datos, d=>valorMetrica(d.r))) || 1;\n  const scale = d3.scaleLinear().domain(d3.range(rampa.length).map(i=>i*max/(rampa.length-1))).range(rampa).clamp(true);\n  const zeroOnly = S.layers.zero;\n\n  gDep.selectAll('path')\n    .attr('fill', f=>{\n      const r = resumen(f.key), v = valorMetrica(r);\n      if(zeroOnly && r.pubs>0) return 'oklch(0.955 0.004 250)';\n      if(S.metric==='dias'){\n        if(!r.pubs && r.dias===null) return 'oklch(0.945 0.004 250)';\n        if(r.dias===null) return 'oklch(0.42 0.16 25)';\n      }\n      return v===0 ? 'oklch(0.97 0.006 250)' : scale(v);\n    })\n    .classed('sel', f=>f.key===S.sel)\n    .classed('dim', f=>zeroOnly && resumen(f.key).pubs>0);\n\n  gLab.style('display', S.layers.labels? null:'none')\n    .selectAll('text').attr('fill-opacity', f=> (zeroOnly && resumen(f.key).pubs>0) ? 0.35 : 1);\n\n  const gaps = [];\n  const mk = gMark.selectAll('g.mk').data(gaps, d=>d.f.key);\n  mk.exit().remove();\n  const enter = mk.enter().append('g').attr('class','mk').attr('pointer-events','none');\n  enter.append('circle').attr('r',8.5).attr('fill','oklch(1 0 0 / .92)').attr('stroke','oklch(0.58 0.18 28)').attr('stroke-width',1.3).attr('stroke-dasharray','2.5 2');\n  enter.append('text').attr('text-anchor','middle').attr('y',3.5).attr('font-size',10).attr('font-family',\"'IBM Plex Mono',monospace\").attr('fill','oklch(0.50 0.18 28)');\n  gMark.selectAll('g.mk').select('text').text(d=>d.r.gap);\n  gMark.selectAll('g.mk').data(gaps, d=>d.f.key);\n  gMark.selectAll('g.mk').attr('transform', d=>{ const c = proj(d3.geoCentroid(d.f)); return 'translate('+c[0]+','+(c[1]+13)+')'; });\n\n  renderKpis(datos);\n  renderLegend(max, scale);\n  renderRank(datos, max);\n  renderRecientes();\n  renderDetail();\n  renderControls();\n}\n\nfunction fillForm(){\n  const c = document.getElementById('f-canal'), t = document.getElementById('f-tema'), dp = document.getElementById('f-dep');\n  c.innerHTML = '<option value=\"\">Elegir…<\u002Foption>' + CANALES.map(x=>'<option value=\"'+x.id+'\">'+x.nom+'<\u002Foption>').join('');\n  t.innerHTML = '<option value=\"\">Elegir…<\u002Foption>' + TEMAS.map(x=>'<option value=\"'+x.id+'\">'+x.nom+'<\u002Foption>').join('');\n  const deps = feats.slice().sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));\n  dp.innerHTML = '<option value=\"\">Elegir…<\u002Foption>' + deps.map(f=>'<option value=\"'+f.key+'\">'+f.nombre+'<\u002Foption>').join('');\n  const hoyISO = new Date(HOY.getTime() - HOY.getTimezoneOffset()*60000).toISOString().slice(0,10);\n  const fi = document.getElementById('f-fecha');\n  fi.value = hoyISO; fi.max = hoyISO;\n}\n\nfunction fillLocalidades(key){\n  const sel = document.getElementById('f-loc'), wrap = document.getElementById('f-otra-wrap');\n  wrap.style.display = 'none';\n  if(!key){ sel.innerHTML = '<option value=\"\">Elegir departamento primero<\u002Foption>'; sel.disabled = true; return; }\n  const base = new Set(LOCALIDADES[key] || []);\n  OBRAS.forEach(o=>{ if(o.key===key) base.add(o.localidad); });\n  AUT.forEach(a=>{ if(a.key===key) base.add(a.localidad); });\n  MANUAL.forEach(m=>{ if(m.key===key) base.add(m.localidad); });\n  const lista = [...base].sort((a,b)=>a.localeCompare(b,'es'));\n  sel.disabled = false;\n  sel.innerHTML = '<option value=\"\">Elegir…<\u002Foption>' + lista.map(l=>'<option value=\"'+l+'\">'+l+'<\u002Foption>').join('') + '<option value=\"__otra\">Otra localidad…<\u002Foption>';\n}\n\nfunction renderRecientes(){\n  const el = document.getElementById('f-recent');\n  if(!MANUAL.length){ el.innerHTML = ''; return; }\n  const ult = MANUAL.slice().sort((a,b)=>b.fecha-a.fecha || b.ts-a.ts).slice(0,6);\n  el.innerHTML = '<span style=\"font-family:\\'IBM Plex Mono\\',monospace;font-size:9px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg-faint);align-self:center\">Últimas cargas<\u002Fspan>'\n    + ult.map(m=>{\n      const c = CANAL.get(m.canal), t = TEMA.get(m.tema);\n      return '<span class=\"rc'+(m.pend?' pend':'')+'\"><i style=\"background:'+c.color+'\"><\u002Fi>'+c.nom+' · '+m.localidad\n        + (m.obra? ' · <span class=\"dt\">'+m.avance+'%<\u002Fspan>' : '')\n        + ' <span class=\"dt\">'+fmtFecha(m.fecha)+'<\u002Fspan>'\n        + '<i style=\"background:'+t.color+';border-radius:50%\"><\u002Fi>'\n        + (m.pend? '<button data-id=\"'+m.id+'\" title=\"Quitar (aún no está en la planilla)\">×<\u002Fbutton>' : '<span class=\"dt\" title=\"Guardada en la planilla\">✓<\u002Fspan>')\n        + '<\u002Fspan>';\n    }).join('');\n  el.querySelectorAll('button[data-id]').forEach(b=>b.onclick=()=>{\n    MANUAL = MANUAL.filter(m=>m.id !== b.dataset.id);\n    PEND = PEND.filter(m=>m.id !== b.dataset.id);\n    guardarManual(); recomputarObras(); render();\n  });\n}\n\nfunction fillObras(key){\n  const sel = document.getElementById('f-obra');\n  if(!key){ sel.innerHTML = '<option value=\"\">Elegir departamento primero<\u002Foption>'; sel.disabled = true; return; }\n  const lista = OBRAS.filter(o=>o.key===key).sort((a,b)=>a.nombre.localeCompare(b.nombre,'es'));\n  sel.disabled = false;\n  sel.innerHTML = '<option value=\"\">Elegir…<\u002Foption>'\n    + lista.map(o=>'<option value=\"'+o.id+'\">'+o.nombre+' ('+o.avance+'%)<\u002Foption>').join('')\n    + '<option value=\"__nueva\">Nueva obra…<\u002Foption>';\n  document.getElementById('f-obranom-wrap').style.display = 'none';\n}\nfunction syncObraUI(){\n  const on = document.getElementById('f-obra-on').getAttribute('aria-pressed')==='true';\n  document.getElementById('f-obra-wrap').style.display = on ? '' : 'none';\n  document.getElementById('f-av-wrap').style.display = on ? '' : 'none';\n  if(!on) document.getElementById('f-obranom-wrap').style.display = 'none';\n}\n\nfunction estadoSync(txt, err){\n  const el = document.getElementById('sync-st');\n  if(!el) return;\n  el.textContent = txt;\n  el.classList.toggle('err', !!err);\n}\nfunction idCanal(v){\n  const s = norm(v);\n  const c = CANALES.find(x=>norm(x.id)===s || norm(x.nom)===s);\n  return c? c.id : null;\n}\nfunction idTema(v){\n  const s = norm(v);\n  const t = TEMAS.find(x=>norm(x.id)===s || norm(x.nom)===s);\n  if(t) return t.id;\n  const p = TEMAS.find(x=>norm(x.nom).startsWith(s.slice(0,8)));\n  return p? p.id : null;\n}\nfunction aISO(v){\n  const s = String(v||'').trim();\n  let m = s.match(/^(\\d{4})-(\\d{2})-(\\d{2})/);\n  if(m) return m[1]+'-'+m[2]+'-'+m[3];\n  m = s.match(/^(\\d{1,2})[\\/-](\\d{1,2})[\\/-](\\d{4})/);\n  if(m) return m[3]+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0');\n  const d = new Date(s);\n  return isNaN(d) ? null : d.toISOString().slice(0,10);\n}\n\nasync function leerFilas(){\n  try{\n    const r = await fetch(SHEET.post + '?listar=1&_=' + Date.now(), {cache:'no-store'});\n    const txt = await r.text();\n    if(txt.trim().startsWith('[') || txt.trim().startsWith('{')){\n      const j = JSON.parse(txt);\n      const arr = Array.isArray(j) ? j : (j.filas || null);\n      if(Array.isArray(arr)) return {fuente:'script', filas:arr.map(f=>{\n        const o = {};\n        Object.keys(f).forEach(k=>{ o[norm(k).toLowerCase()] = f[k]; });\n        return o;\n      })};\n    }\n  }catch(e){}\n  const r = await fetch(SHEET.csv + '&_=' + Date.now(), {cache:'no-store'});\n  if(!r.ok) throw new Error('HTTP '+r.status);\n  return {fuente:'csv', filas: d3.csvParse(await r.text()).map(f=>{\n    const o = {};\n    Object.keys(f).forEach(k=>{ o[norm(k).toLowerCase()] = f[k]; });\n    return o;\n  })};\n}\n\nasync function sincronizar(){\n  estadoSync('sincronizando…');\n  try{\n    const lect = await leerFilas();\n    const filas = lect.filas;\n    const deps = new Map(feats.map(f=>[f.key, f.nombre]));\n    REMOTAS = filas.map((f,i)=>{\n      const iso = aISO(f.fecha), canal = idCanal(f.canal), tema = idTema(f.tema), key = norm(f.departamento);\n      if(!iso || !canal || !tema || !key) return null;\n      const av = String(f.avance||'').trim();\n      return {id:'r'+i, key, dep: deps.get(key) || f.departamento, localidad:(f.localidad||'').trim() || '—',\n        canal, tema, fechaISO:iso, fecha:new Date(iso+'T12:00:00'),\n        obra:(f.obra||'').trim() || null, avance: av===''? null : Math.max(0, Math.min(100, Math.round(+av))), ts:i};\n    }).filter(Boolean);\n    const vistas = new Set(REMOTAS.map(claveP));\n    const antes = PEND.length;\n    PEND = PEND.filter(p=>!vistas.has(claveP(p)));\n    if(PEND.length !== antes) guardarManual();\n    MANUAL = REMOTAS.concat(PEND);\n    recomputarObras();\n    render();\n    const hora = new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'});\n    estadoSync(REMOTAS.length + ' en la planilla · ' + (PEND.length? PEND.length+' sin subir · ' : '') + 'actualizado ' + hora);\n  }catch(e){\n    estadoSync('sin conexión con la planilla · se muestran los datos locales', true);\n  }\n}\n\nasync function subirFila(m){\n  const cuerpo = JSON.stringify({fecha:m.fechaISO, canal:CANAL.get(m.canal).nom, tema:TEMA.get(m.tema).nom,\n    departamento:m.dep, localidad:m.localidad, obra:m.obra||'', avance:m.avance??''});\n  try{\n    if(navigator.sendBeacon){\n      const ok = navigator.sendBeacon(SHEET.post, new Blob([cuerpo], {type:'text/plain;charset=utf-8'}));\n      if(ok) return true;\n    }\n    await fetch(SHEET.post, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:cuerpo});\n    return true;\n  }catch(e){ return false; }\n}\n\nasync function importarJSON(file){\n  let arr;\n  try{ arr = JSON.parse(await file.text()); }catch(e){ estadoSync('el archivo no es un JSON válido', true); return; }\n  if(!Array.isArray(arr)) arr = [arr];\n  const deps = new Map(feats.map(f=>[f.key, f.nombre]));\n  const filas = [], malas = [];\n  arr.forEach((x,i)=>{\n    const iso = aISO(x.fecha), canal = idCanal(x.canal), tema = idTema(x.tema), key = norm(x.departamento);\n    if(!iso || !canal || !tema || !deps.has(key)){ malas.push(i+1); return; }\n    const av = x.avance===''||x.avance==null ? null : Math.max(0, Math.min(100, Math.round(+x.avance)));\n    filas.push({id:'i'+Date.now()+i, key, dep:deps.get(key), localidad:(x.localidad||'').trim()||'—',\n      canal, tema, fechaISO:iso, fecha:new Date(iso+'T12:00:00'), obra:(x.obra||'').trim()||null, avance:av, ts:Date.now()+i, pend:true});\n  });\n  if(!filas.length){ estadoSync('no se pudo leer ninguna fila del archivo', true); return; }\n  estadoSync('subiendo ' + filas.length + ' fila' + (filas.length>1?'s':'') + '…');\n  for(const f of filas){ await subirFila(f); await new Promise(r=>setTimeout(r,350)); }\n  setTimeout(async ()=>{\n    await sincronizar();\n    if(malas.length) estadoSync(document.getElementById('sync-st').textContent + ' · ' + malas.length + ' fila(s) omitidas por datos inválidos', true);\n  }, 3000);\n}\n\nfunction recomputarObras(){\n  OBRAS.length = 0;\n  OBRAS_RAW.forEach((o,i)=>OBRAS.push({\n    id:i, dep:o[0], key:norm(o[0]), nombre:o[1], localidad:o[2], tema:o[3], avance:o[4],\n    pubs:(o[5]||[]).map(p=>({canal:p[0], fecha:new Date(p[1]+'T12:00:00'), fechaISO:p[1]}))\n  }));\n  replayManual();\n  const dep = document.getElementById('f-dep');\n  if(dep && dep.value) fillObras(dep.value);\n}\n\nfunction agregarPub(){\n  const nota = document.getElementById('cg-note');\n  const fecha = document.getElementById('f-fecha').value;\n  const canal = document.getElementById('f-canal').value;\n  const tema  = document.getElementById('f-tema').value;\n  const key   = document.getElementById('f-dep').value;\n  let loc     = document.getElementById('f-loc').value;\n  if(loc === '__otra') loc = document.getElementById('f-otra').value.trim();\n  const faltan = [];\n  if(!fecha) faltan.push('fecha'); if(!canal) faltan.push('canal'); if(!tema) faltan.push('tema');\n  if(!key) faltan.push('departamento'); if(!loc) faltan.push('localidad');\n  if(faltan.length){ nota.style.color = 'var(--alert)'; nota.textContent = 'Falta: ' + faltan.join(', '); return; }\n\n  const conObra = document.getElementById('f-obra-on').getAttribute('aria-pressed')==='true';\n  let obraRef = null, avanceVal = null;\n  if(conObra){\n    const ov = document.getElementById('f-obra').value;\n    const av = document.getElementById('f-av').value;\n    if(!ov){ nota.style.color='var(--alert)'; nota.textContent='Falta: obra (o desactivá “Informa avance de obra”)'; return; }\n    if(av==='' || isNaN(+av) || +av<0 || +av>100){ nota.style.color='var(--alert)'; nota.textContent='El avance debe ser un número de 0 a 100'; return; }\n    avanceVal = Math.round(+av);\n    if(ov==='__nueva'){\n      const nom = document.getElementById('f-obranom').value.trim();\n      if(!nom){ nota.style.color='var(--alert)'; nota.textContent='Falta: nombre de la obra nueva'; return; }\n      obraRef = {id:OBRAS.length, dep:(feats.find(f=>f.key===key)||{}).nombre||key, key, nombre:nom, localidad:loc, tema, avance:avanceVal, pubs:[], nueva:true};\n      OBRAS.push(obraRef);\n    } else {\n      obraRef = OBRAS.find(o=>o.id===+ov);\n      if(obraRef) obraRef.avance = avanceVal;\n    }\n  }\n  const dep = (feats.find(f=>f.key===key)||{}).nombre || key;\n  const m = {id:'m'+Date.now()+Math.random().toString(36).slice(2,6), key, dep, localidad:loc, canal, tema, fechaISO:fecha, fecha:new Date(fecha+'T12:00:00'), ts:Date.now(),\n    obra: obraRef? obraRef.nombre : null, avance: avanceVal};\n  if(obraRef) obraRef.pubs.push({canal, fecha:m.fecha, fechaISO:fecha});\n  MANUAL.push(m); PEND.push(m); m.pend = true; guardarManual();\n  if(!S.canal.has(canal)) S.canal.add(canal);\n  if(!S.tema.has(tema)) S.tema.add(tema);\n  nota.style.color = 'var(--ok)';\n  nota.textContent = 'Cargada: ' + CANAL.get(canal).nom + ' · ' + loc + ' · ' + fmtFecha(m.fecha) + (obraRef? ' · ' + obraRef.nombre + ' ' + avanceVal + '%' : '');\n  document.getElementById('f-av').value = '';\n  document.getElementById('f-obranom').value = '';\n  fillObras(key);\n  document.getElementById('f-otra').value = '';\n  document.getElementById('f-otra-wrap').style.display = 'none';\n  if(document.getElementById('f-loc').value === '__otra') fillLocalidades(key);\n  render();\n  subirFila(m).then(ok=>{\n    if(!ok){ estadoSync('no se pudo enviar · queda guardada acá', true); return; }\n    estadoSync('enviada · verificando en la planilla…');\n    setTimeout(async ()=>{\n      await sincronizar();\n      if(PEND.some(p=>p.id===m.id)) estadoSync('no se confirmó en la planilla · revisá el acceso de la app web (debe ser “Cualquier usuario”)', true);\n    }, 4000);\n  });\n}\n\n\nfunction renderKpis(datos){\n  const tot = datos.reduce((a,d)=>a + d.r.pubs, 0);\n  const conPub = datos.filter(d=>d.r.pubs>0).length;\n  const sinPub = datos.length - conPub;\n  const prov = (()=>{\n    const d0 = desde();\n    let n = BASE_PUBS.concat(MANUAL).filter(m=>m.key==='PROVINCIAL' && S.canal.has(m.canal) && S.tema.has(m.tema) && (!d0 || m.fecha>=d0)).length;\n    if(S.layers.base && !d0) BASE_AGG.forEach(t=>{ if(t.key==='PROVINCIAL' && S.canal.has(t.canal) && S.tema.has(t.tema)) n += t.n; });\n    return n;\n  })();\n  const k = [\n    ['Publicaciones', tot, ''],\n    ['Deptos. con cobertura', conPub, '<em>de '+datos.length+'<\u002Fem>'],\n    ['Deptos. sin cobertura', sinPub, ''],\n    ['Provinciales', prov, '']\n  ];\n  document.getElementById('kpis').innerHTML = k.map(([l,v,e])=>'<div class=\"kpi\"><b>'+v+e+'<\u002Fb><span>'+l+'<\u002Fspan><\u002Fdiv>').join('');\n}\n\nfunction renderLegend(max, scale){\n  const m = METRICAS.find(x=>x.id===S.metric);\n  const steps = 6, ramp = d3.range(steps).map(i=>scale(i*max/(steps-1)));\n  document.getElementById('legend').innerHTML =\n    '<h5>'+m.unidad+'<\u002Fh5>'\n    + '<div class=\"ramp\">'+ramp.map(c=>'<span style=\"background:'+c+'\"><\u002Fspan>').join('')+'<\u002Fdiv>'\n    + '<div class=\"ticks\"><span>0<\u002Fspan><span>'+ (S.metric==='dias'? Math.round(max)+' días' : max) +'<\u002Fspan><\u002Fdiv>'\n    + '<div class=\"pk\" style=\"margin-top:10px\">'\n      + (S.metric==='dias'? '<div><i style=\"background:oklch(0.42 0.16 25)\"><\u002Fi>sin fecha registrada<\u002Fdiv>':'')\n      + '<div><i style=\"background:oklch(0.945 0.004 250);border:1px solid var(--line)\"><\u002Fi>sin publicaciones en el filtro<\u002Fdiv>'\n    + '<\u002Fdiv>';\n}\n\nfunction renderRank(datos, max){\n  const m = METRICAS.find(x=>x.id===S.metric);\n  document.getElementById('rank-unit').textContent = m.unidad;\n  let rows = datos.slice();\n  if(S.layers.zero) rows = rows.filter(d=>d.r.pubs===0);\n  rows.sort((a,b)=> valorMetrica(b.r)-valorMetrica(a.r) || a.f.nombre.localeCompare(b.f.nombre));\n  const el = document.getElementById('rank');\n  if(!rows.length){ el.innerHTML = '<div class=\"empty\">Sin departamentos para este filtro.<\u002Fdiv>'; return; }\n  el.innerHTML = rows.map((d,i)=>{\n    const v = valorMetrica(d.r), pc = max? Math.max(Math.min(v,max)/max*100, v>0?3:0) : 0;\n    return '<button class=\"rk '+(d.f.key===S.sel?'on':'')+' '+(v===0?'zero':'')+'\" data-key=\"'+d.f.key+'\">'\n      + '<u>'+(i+1).toString().padStart(2,'0')+'<\u002Fu>'\n      + '<span class=\"cell nm\">'+d.f.nombre+'<\u002Fspan>'\n      + '<span class=\"v\">'+textoMetrica(d.r)+'<\u002Fspan>'\n      + '<span class=\"bw\" style=\"grid-column:2\"><div style=\"width:'+pc+'%\"><\u002Fdiv><\u002Fspan>'\n      + '<\u002Fbutton>';\n  }).join('');\n  el.querySelectorAll('.rk').forEach(b=>b.onclick=()=>{ S.sel = S.sel===b.dataset.key? null : b.dataset.key; render(); });\n}\n\nfunction donut(entries, size){\n  const total = d3.sum(entries, d=>d.v);\n  if(!total) return '<p class=\"pie-empty\">Sin publicaciones en el filtro actual.<\u002Fp>';\n  const datos = entries.filter(d=>d.v>0);\n  const arcs = d3.pie().sort(null).value(d=>d.v)(datos);\n  const gen = d3.arc().innerRadius(size*0.29).outerRadius(size*0.47).padAngle(0.02).cornerRadius(1.5);\n  const paths = arcs.map((a,i)=>'<path d=\"'+gen(a)+'\" fill=\"'+datos[i].color+'\" stroke=\"oklch(1 0 0)\" stroke-width=\"1\"><\u002Fpath>').join('');\n  const svgm = '<svg width=\"'+size+'\" height=\"'+size+'\" viewBox=\"0 0 '+size+' '+size+'\" role=\"img\">'\n    + '<g transform=\"translate('+size/2+','+size/2+')\">'+paths\n    + '<text class=\"ctr\" text-anchor=\"middle\" y=\"2\">'+total+'<\u002Ftext>'\n    + '<text class=\"ctr-s\" text-anchor=\"middle\" y=\"13\">TOTAL<\u002Ftext><\u002Fg><\u002Fsvg>';\n  const lg = '<div class=\"lg\">'+datos.sort((a,b)=>b.v-a.v).map(d=>'<div><i style=\"background:'+d.color+'\"><\u002Fi><span class=\"nm\">'+d.nom+'<\u002Fspan><b>'+d.v+' · '+Math.round(d.v/total*100)+'%<\u002Fb><\u002Fdiv>').join('')+'<\u002Fdiv>';\n  return svgm + lg;\n}\n\nfunction renderDetail(){\n  const el = document.getElementById('detail');\n  const had = document.body.classList.contains('has-sel');\n  document.body.classList.toggle('has-sel', !!S.sel);\n  if(had !== !!S.sel){ requestAnimationFrame(resize); setTimeout(resize, 220); }\n  if(!S.sel){\n    el.innerHTML = '';\n    return;\n  }\n  const f = feats.find(x=>x.key===S.sel); if(!f) return;\n  const r = resumen(f.key);\n  let html = '<div class=\"dh\"><div class=\"eyebrow\"><span>Departamento<\u002Fspan><button id=\"close-d\">cerrar ✕<\u002Fbutton><\u002Fdiv>'\n    + '<h2>'+f.nombre+'<\u002Fh2><p>Cabecera: '+(f.cabecera||'—')+'<\u002Fp>'\n    + '<div class=\"dstats\">'\n      + '<div><b>'+r.pubs+'<\u002Fb><span>publicaciones<\u002Fspan><\u002Fdiv>'\n      + '<div><b>'+(r.dias===null? '—' : r.dias)+'<\u002Fb><span>días sin publicar<\u002Fspan><\u002Fdiv>'\n    + '<\u002Fdiv>'\n    + (r.pubs? '<div class=\"tags\" style=\"display:flex;gap:5px;flex-wrap:wrap;margin-top:10px\">'+CANALES.filter(c=>r.porCanal[c.id]).map(c=>'<span class=\"tag\"><i style=\"background:'+c.color+'\"><\u002Fi>'+c.nom+' '+r.porCanal[c.id]+'<\u002Fspan>').join('')+'<\u002Fdiv>':'')\n    + '<\u002Fdiv>';\n\n  html += '<div class=\"pies\">'\n    + '<div class=\"pie\"><h5>Publicaciones por plataforma<\u002Fh5>'\n      + donut(CANALES.map(c=>({nom:c.nom, color:c.color, v:r.porCanal[c.id]||0})), 104)\n    + '<\u002Fdiv>'\n    + '<div class=\"pie\"><h5>Publicaciones por tipo de obra<\u002Fh5>'\n      + donut(TEMAS.map(t=>({nom:t.nom, color:t.color, v:r.porTema[t.id]||0})), 104)\n    + '<\u002Fdiv>'\n  + '<\u002Fdiv>';\n\n  html += '<div class=\"subhead\"><span>Publicaciones<\u002Fspan><span>'+r.manuales.length+(r.agg? ' + '+r.agg+' base' : '')+'<\u002Fspan><\u002Fdiv>';\n  if(!r.manuales.length){\n    html += '<div class=\"empty\">'+(r.agg\n      ? '<b>'+r.agg+' publicaciones del relevamiento '+BASE_LABEL+'<\u002Fb>Ese relevamiento es agregado: no tiene fecha ni localidad por publicación, por eso no se listan una por una.'\n      : '<b>Sin publicaciones<\u002Fb>No hay publicaciones de este departamento con los filtros activos.')+'<\u002Fdiv>';\n  } else {\n    html += r.manuales.slice().sort((a,b)=>b.fecha-a.fecha).map(m=>{\n      const c = CANAL.get(m.canal), t = TEMA.get(m.tema);\n      return '<div class=\"obra\"><div class=\"pub\"><span class=\"pl\"><i style=\"background:'+c.color+'\"><\u002Fi>'+c.nom+'<\u002Fspan><span><\u002Fspan><span class=\"dt\">'+fmtFecha(m.fecha)+'<\u002Fspan><\u002Fdiv>'\n        + '<p class=\"loc\" style=\"margin-top:4px\">'+m.localidad+(m.obra? ' · '+m.obra : '')+'<\u002Fp>'\n        + (m.obra && m.avance!=null ? '<div class=\"prog\"><span class=\"track\"><div style=\"width:'+m.avance+'%;background:'+t.color+'\"><\u002Fdiv><\u002Fspan><span class=\"pct\">'+m.avance+'%<\u002Fspan><\u002Fdiv>' : '')\n        + '<div class=\"tags\" style=\"margin-top:6px\"><span class=\"tag\"><i style=\"background:'+t.color+'\"><\u002Fi>'+t.nom+'<\u002Fspan><\u002Fdiv><\u002Fdiv>';\n    }).join('');\n    if(r.agg) html += '<div class=\"empty\" style=\"padding:10px 16px\">+ '+r.agg+' del relevamiento '+BASE_LABEL+', sin fecha por publicación.<\u002Fdiv>';\n  }\n\n  {\n    const auts = AUT.filter(a=>a.key===f.key);\n    if(auts.length){\n      html += '<div class=\"subhead\"><span>Autoridades<\u002Fspan><span>'+auts.length+'<\u002Fspan><\u002Fdiv>';\n      html += auts.map(a=>{\n        const p = PART.get(a.partido);\n        return '<div class=\"aut\"><h4>'+a.nombre+'<\u002Fh4><span class=\"part\"><i style=\"background:'+p.color+'\"><\u002Fi>'+p.nom+'<\u002Fspan><span class=\"cargo\">'+a.cargo+' · '+a.localidad+'<\u002Fspan><\u002Fdiv>';\n      }).join('');\n    }\n  }\n  el.innerHTML = html;\n  el.scrollTop = 0;\n  const c = document.getElementById('close-d'); if(c) c.onclick = ()=>{ S.sel=null; render(); };\n}\n\n/* ── CONTROLES ────────────────────────────────────────────────────── */\nfunction chipsHTML(items, active, counts){\n  return items.map(i=>'<button data-id=\"'+i.id+'\" aria-pressed=\"'+active.has(i.id)+'\">'\n    + (i.color? '<span class=\"dot\" style=\"background:'+i.color+'\"><\u002Fspan>':'')\n    + i.nom + (counts? '<span class=\"n\">'+(counts[i.id]||0)+'<\u002Fspan>':'') + '<\u002Fbutton>').join('');\n}\nfunction renderControls(){\n  document.getElementById('metric').innerHTML = METRICAS.map(m=>'<button data-id=\"'+m.id+'\" aria-pressed=\"'+(S.metric===m.id)+'\">'+m.nom+'<\u002Fbutton>').join('');\n  document.getElementById('metric').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.metric=b.dataset.id; render(); });\n\n  const d0 = desde(), cCanal = {}, cTema = {};\n  BASE_PUBS.concat(MANUAL).forEach(m=>{\n    if(d0 && m.fecha < d0) return;\n    if(S.tema.has(m.tema)) cCanal[m.canal] = (cCanal[m.canal]||0)+1;\n    if(S.canal.has(m.canal)) cTema[m.tema] = (cTema[m.tema]||0)+1;\n  });\n  if(S.layers.base && !d0) BASE_AGG.forEach(t=>{\n    if(S.tema.has(t.tema)) cCanal[t.canal] = (cCanal[t.canal]||0)+t.n;\n    if(S.canal.has(t.canal)) cTema[t.tema] = (cTema[t.tema]||0)+t.n;\n  });\n  const cn = document.getElementById('canal'); cn.innerHTML = chipsHTML(CANALES, S.canal, cCanal);\n  cn.querySelectorAll('button').forEach(b=>b.onclick=()=>{ toggle(S.canal, b.dataset.id, CANALES); render(); });\n  const tm = document.getElementById('tema'); tm.innerHTML = chipsHTML(TEMAS, S.tema, cTema);\n  tm.querySelectorAll('button').forEach(b=>b.onclick=()=>{ toggle(S.tema, b.dataset.id, TEMAS); render(); });\n\n  document.getElementById('periodo').innerHTML = PERIODOS.map(p=>'<button data-id=\"'+p.id+'\" aria-pressed=\"'+(S.periodo===p.id)+'\">'+p.nom+'<\u002Fbutton>').join('');\n  document.getElementById('periodo').querySelectorAll('button').forEach(b=>b.onclick=()=>{ S.periodo=b.dataset.id; render(); });\n}\nfunction toggle(set, id, all){\n  if(set.has(id)) set.delete(id); else set.add(id);\n}\ndocument.querySelectorAll('[data-all]').forEach(b=>b.onclick=()=>{\n  const s = b.dataset.all==='canal'? S.canal : S.tema;\n  const all = b.dataset.all==='canal'? CANALES : TEMAS;\n  s.clear(); all.forEach(x=>s.add(x.id)); render();\n});\ndocument.querySelectorAll('[data-none]').forEach(b=>b.onclick=()=>{\n  (b.dataset.none==='canal'? S.canal : S.tema).clear(); render();\n});\nconst rt = document.getElementById('rank-toggle');\nrt.onclick = ()=>{ S.rankOpen = !S.rankOpen; rt.setAttribute('aria-expanded', S.rankOpen); document.getElementById('rank').hidden = !S.rankOpen; };\n[['ly-labels','labels'],['ly-base','base'],['ly-zero','zero']].forEach(([id,k])=>{\n  const b = document.getElementById(id);\n  b.onclick = ()=>{ S.layers[k] = !S.layers[k]; b.setAttribute('aria-pressed', S.layers[k]); render(); };\n});\ndocument.getElementById('zin').onclick = ()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);\ndocument.getElementById('zout').onclick = ()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);\ndocument.getElementById('zrst').onclick = ()=>svg.transition().duration(300).call(zoom.transform, d3.zoomIdentity);\ndocument.addEventListener('keydown', e=>{ if(e.key==='Escape' && S.sel){ S.sel=null; render(); } });\ndocument.getElementById('f-dep').addEventListener('change', e=>{ fillLocalidades(e.target.value); fillObras(e.target.value); });\ndocument.getElementById('f-obra-on').onclick = function(){\n  const on = this.getAttribute('aria-pressed')!=='true';\n  this.setAttribute('aria-pressed', on); syncObraUI();\n};\ndocument.getElementById('f-obra').addEventListener('change', e=>{\n  document.getElementById('f-obranom-wrap').style.display = e.target.value==='__nueva' ? '' : 'none';\n  const o = OBRAS.find(x=>x.id===+e.target.value);\n  if(o) document.getElementById('f-av').value = o.avance;\n});\ndocument.getElementById('f-loc').addEventListener('change', e=>{\n  document.getElementById('f-otra-wrap').style.display = e.target.value==='__otra' ? '' : 'none';\n});\ndocument.getElementById('f-add').onclick = agregarPub;\nconst cgT = document.getElementById('cg-toggle');\nif(window.innerHeight < 720){ cgT.setAttribute('aria-expanded','false'); document.getElementById('cg-body').hidden = true; }\ncgT.onclick = ()=>{\n  const on = cgT.getAttribute('aria-expanded')!=='true';\n  cgT.setAttribute('aria-expanded', on);\n  document.getElementById('cg-body').hidden = !on;\n  setTimeout(resize, 0);\n};\ndocument.getElementById('sync-btn').onclick = sincronizar;\nfillLocalidades('');\nfillObras('');\nrenderRecientes();\nrenderControls();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
